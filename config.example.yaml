# Doc Index Configuration
# Copy this file to <your-project>/doc-index.yaml and customize.

project:
  name: "Your Project"                  # Full project name (shown in header)
  short_name: "YP"                      # PWA short name (home screen)
  description: "Project documentation index"  # PWA description
  lang: "en"                            # Page language: "en" or "zh-CN"
  color: "#2d5f8a"                      # Theme color (header, buttons, PWA)
  subtitle: "Document Index"            # Header subtitle

repo:
  path: ~/projects/your-project         # Absolute or ~ path to project repo
  file_types:                           # Whitelist: only document-style files are indexed.
    # Doc-index intentionally excludes source code — its job is to help you
    # understand a project's *plans / specs / diagrams / notes*, not read code.
    # Anything not in this list (.py, .js, .ts, .go, .rs, ...) is skipped.
    - pdf
    - md
    - txt
    - html
    - ipynb       # Jupyter notebooks (rendered as static HTML on click)
    - yaml        # Configs surfaced via the YAML viewer
    - yml
    - xlsx        # Spreadsheets / data tables
    - xls
    - csv
    - docx        # Word docs
    - doc
    - pptx        # Slide decks
    - ppt
    - png         # Diagrams / screenshots
    - jpg
    - jpeg
    - gif
    - webp
    - svg         # Vector diagrams
  ignore:                               # Folders/patterns to skip
    - .git
    - node_modules
    - __pycache__
    - .DS_Store
    - "*.pyc"
    - .env
    - .venv

serve:
  root: /usr/share/nginx/html/your-project-docs  # Output directory for generated site
  url_base: /your-project-docs/                  # URL path prefix (for nginx location)
  domain: ""                                     # REQUIRED for full server block — e.g. "docs.example.com"
  base_font_px: 16                               # Root font size (px). One knob: every font-size
                                                 # is a rem off this; mobile (<=480px) gets +1px.
                                                 # Bump to 17-18 for larger text. Default 16.
  auth:                                          # Basic auth — ON by default
    enabled: true
    user: "admin"                                # Login user
    auto_password: true                          # Generate random password at init
    password: ""                                 # Filled in by init (or set manually)
    htpasswd_path: ""                            # Filled in by init: <serve.root>/.htpasswd

design_doc:
  # Design Doc Gate — make a project design doc a first-class citizen.
  # On first deploy (`serve.py init`) doc-index ensures this project has a
  # design doc: it ADOPTS an existing docs/DESIGN.md, INCORPORATES scattered
  # design docs by linking them in place, or GENERATES a seed from the template.
  # Every scan then reports the doc's freshness and pins a status card on the
  # PWA. See DESIGN_DOC_CONVENTION.md.
  enabled: true                         # false = feature off for this project
  path: docs/DESIGN.md                  # canonical location (relative to repo.path)
  required_on_init: true                # init ensures one exists; only a real IO error fails
  template: default                     # default | minimal | <path to a custom .md>
  proposal_ledger: true                 # keep + surface a Proposal Ledger section
  # When proposal_ledger is on, every scan also SYNCS proposal files into the
  # ledger: it reads docs/10-next/PROPOSAL_*.md (and docs/90-archive/), appends a
  # row for any proposal not yet listed, advances status forward, and once a
  # proposal is landed/implemented auto-fills "Approved by" (Author) and "Landed"
  # (Date). Idempotent; skipped if the ledger table can't be parsed. See
  # DESIGN_DOC_CONVENTION.md for the fixed PROPOSAL_*.md format.
  auto_snapshot:                        # optional live-config block spliced into AUTO:START/END
    enabled: false
    generator: ""                       # path to a project-specific snapshot generator (optional)
    max_age_h: 25                       # snapshot older than this -> red (feeds the freshness check)

quick_links: []                         # Shortcut links at top of page
  # - label: "Project Homepage"
  #   url: "https://example.com"
  #   icon: "🌐"
  # - label: "GitHub Repo"
  #   url: "https://github.com/owner/repo"
  #   icon: "📦"

sections:
  auto: true                            # Auto-generate sections from folder structure

  # Optional: promote selected SUBfolders to top-level sections.
  # By default doc-index groups by direct child folders of the repo root.
  # If you organise status under one parent (e.g. docs/00-now, docs/10-next),
  # `promote` lifts those subfolders out and renders them as top-level
  # sections — IN THE ORDER they appear here. Promoted sections render BEFORE
  # all other sections, so your most-active state is always at the top.
  #
  # Recommended convention: prefix folder names with a 2-digit sort code
  # (00-now, 10-next, 20-design, 30-guide, 40-business, 90-archive) and
  # pair `promote` with `overrides` for color + title + collapsed state.
  # promote:
  #   - "docs/00-now"
  #   - "docs/10-next"
  #   - "docs/20-design"
  #   - "docs/30-guide"
  #   - "docs/40-business"
  #   - "docs/90-archive"

  color_cycle:                          # Colors rotate per top-level folder
    - "#2d5f8a"                         # Blue
    - "#27ae60"                         # Green
    - "#e67e22"                         # Orange
    - "#8e44ad"                         # Purple
    - "#e74c3c"                         # Red
    - "#16a085"                         # Teal
    - "#95a5a6"                         # Gray

  # Optional: override specific folders
  # overrides:
  #   "docs/00-now":
  #     title: "🟢 NOW — currently in flight"
  #     color: "#27ae60"
  #   "docs/10-next":
  #     title: "🟡 NEXT — designed, awaiting sprint"
  #     color: "#e67e22"
  #   "docs/20-design":
  #     title: "📐 DESIGN — architecture + long-term reference"
  #     color: "#2d5f8a"
  #     collapsed: true
  #   "docs/90-archive":
  #     title: "📦 ARCHIVE — completed / superseded"
  #     color: "#7f8c8d"
  #     collapsed: true

  root_files_section: "Project Root"    # Section name for files in repo root

tags:
  auto: true                            # Auto-tag based on git timestamps
  new_days: 7                           # Files added within N days get "New" tag
  updated_days: 3                       # Files modified within N days get "Updated" tag
  labels:                               # Tag labels (localize as needed)
    new: "New"
    updated: "Updated"
    latest: "Latest"

sync:
  # Optional: mirror this project's generated index + source docs to a shared
  # git repo. Useful when doc-index runs on one device but the indexed docs
  # need to be readable from other devices (team-shared knowledge hub,
  # cross-device mesh, snapshot history).
  #
  # When enabled, scan.py invokes scripts/sync.py at the end:
  #   1. Clone (first run) or fetch+reset (subsequent) the configured repo
  #   2. Recreate <target_subdir>/ inside the clone with:
  #      - source docs matching repo.file_types / repo.ignore
  #      - generated _index.html + _manifest.json (if include_html=true)
  #   3. Commit + push if anything changed.
  #
  # SOFT-FAIL: sync errors don't break scan.py — your local PWA still works.
  #
  # Authentication: embed a token in remote_url (HTTPS) or use SSH with an
  # agent forwarding key. Either works.
  enabled: false                              # Set true to opt in
  remote_url: "<YOUR_SHARED_REPO_GIT_URL>"    # e.g. https://USER:TOKEN@github.com/your-org/team-docs.git
  remote_branch: "main"                       # Branch to push to
  target_subdir: "<TARGET_SUBDIR_IN_REPO>"    # Where in the repo to publish.
                                              # e.g. "shared/doc-index/your-project"
  local_clone_dir: ""                         # Optional. Default: ~/.cache/doc-index-sync/<short_name>
  include_docs: true                          # Publish source docs (receivers get readable content)
  include_html: true                          # Publish generated _index.html so receivers see the rendered PWA
  commit_message_template: "doc-index sync: {project} @ {timestamp}"
  # Optional git commit identity (LOCAL to the sync clone, never --global).
  # Defaults are a generic bot identity; override if you want commits attributed
  # to a specific user. Useful when running on a server where root has no
  # global git identity configured.
  author_name: ""                             # default: "doc-index-sync"
  author_email: ""                            # default: "noreply@doc-index.local"

pre_scan_hooks: []                      # Scripts to run BEFORE the index scan.
  # Use this to run project-specific preparation logic (e.g. syncing a
  # proposal ledger, pulling data from an API, generating summary files)
  # before doc-index scans the repo.  ${repo.path} is expanded to the
  # configured repo path.  Hooks run in order; a non-zero exit warns
  # but does not abort the scan.
  #
  # (Proposal-Ledger syncing is built in — see design_doc.proposal_ledger — so it
  # does NOT need a hook.) Use hooks for project-specific prep, e.g.:
  # - name: "Pull External Data"
  #   command: "python3 ${repo.path}/scripts/fetch-data.py"
  # - name: "Generate Summary"
  #   command: "python3 ${repo.path}/scripts/build-summary.py"

triggers:
  cron: ""                              # Cron expression, empty = disabled. e.g. "0 */6 * * *"
  manual: true                          # Always true — can always run scan.py manually

external_sources: []                    # External API adapters (see adapters/)
  # - name: "GitHub Releases"
  #   adapter: "github_releases"
  #   config:
  #     repo: "owner/repo"
  #     token_env: "GITHUB_TOKEN"
  #     download_to: "releases/"
